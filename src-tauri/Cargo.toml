[package]
name = "gitbaro"
version = "0.1.2"
description = "A macOS Git GUI with per-repo GitHub account management"
authors = ["GitBaro"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "gitbaro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
git2 = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
notify = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
md5 = "0.7"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Syntax parsing for the verify tree-sitter layer:
# structural diff (V1 · V17) and the symbol index (V7 · V8 · V9).
# Versions fixed by docs/verify-treesitter-design.md §1.1.
tree-sitter = "0.26.11"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
